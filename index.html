#app{max-width:480px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.card{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:20px 18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(120,40,70,.12),0 2px 6px rgba(120,40,70,.06)}
h1{margin:16px 0;text-align:center;font-weight:400;font-family:"Kaushan Script",cursive;font-size:44px;line-height:1.15;color:var(--bo);text-shadow:0 2px 0 #fff,0 4px 14px rgba(214,51,108,.25)}
h1.logo{font-family:"Caveat","Baloo 2","Nunito",cursive;font-weight:700;letter-spacing:1px;line-height:1.1;font-size:clamp(48px,14vw,66px);transform:rotate(-2deg);margin:clamp(14px,3.5svh,30px) 0 clamp(12px,3svh,26px);background:linear-gradient(100deg,#d6336c,#9c36b5 55%,#3b5bdb);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 12px rgba(156,54,181,.3));padding:6px 22px 8px 12px;overflow:visible}
h2{font-size:19px;margin:0 0 10px;font-weight:900;letter-spacing:.2px}
p{color:var(--mu);line-height:1.5;margin:6px 0;font-size:15px}
input{width:100%;padding:15px;border-radius:16px;border:2px solid var(--bd);background:#fff;color:var(--tx);font:800 18px "Nunito",sans-serif;margin:5px 0;text-align:center;text-transform:uppercase;letter-spacing:5px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--bo)}
button{width:100%;padding:15px;border:0;border-radius:16px;font:800 17px "Nunito",sans-serif;letter-spacing:.3px;background:linear-gradient(135deg,#e64980,#c2255c);color:#fff;margin-top:10px;cursor:pointer;box-shadow:0 6px 16px rgba(214,51,108,.3),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .1s,box-shadow .15s}
button:active{transform:translateY(2px) scale(.99);box-shadow:0 2px 8px rgba(0,0,0,.15)}
button.alt{background:#fff;color:var(--tx);border:2px solid var(--bd);box-shadow:0 3px 10px rgba(120,40,70,.08)}
button.b{background:linear-gradient(135deg,#e64980,#c2255c)}button.g{background:linear-gradient(135deg,#4c6ef5,#364fc7);box-shadow:0 6px 16px rgba(59,91,219,.3),inset 0 1px 0 rgba(255,255,255,.25)}button.y{background:linear-gradient(135deg,#9775fa,#6741d9);box-shadow:0 6px 16px rgba(123,92,240,.3)}
button:disabled{opacity:.45;box-shadow:none;cursor:default}button.me{outline:4px solid #ffd43b;outline-offset:2px}
.vs{position:relative;display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;margin:6px 0}
.vs.home{margin:clamp(8px,2.5svh,22px) 0 0}
.vs img{grid-row:1;width:100%;min-width:0;aspect-ratio:5/7;max-height:36vh;max-height:36svh;object-fit:cover;border-radius:22px;border:4px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.vs .l{grid-column:1;transform:rotate(-3deg)}.vs .r{grid-column:3;transform:rotate(3deg)}
.vs.sm{margin:2px 0 0}.vs.sm{grid-template-columns:auto 46px auto;justify-content:center}.vs.sm img{width:auto;aspect-ratio:3/4;max-height:none;height:clamp(90px,19vh,160px);border-width:3px;border-radius:16px}.vs.sm span{font-size:24px;-webkit-text-stroke:2px #2a1620}
h1.sm{font-size:32px}
button.op{background:#fff4f7;color:var(--tx);border:2px solid #f7c6d4;box-shadow:0 3px 10px rgba(214,51,108,.1);transition:background .15s,color .15s,transform .15s}
button.op.on{background:linear-gradient(135deg,#ff6b8b,#e8144f);color:#fff;border-color:#e8144f;box-shadow:0 6px 18px rgba(232,20,79,.45);transform:scale(1.03)}
button.op:disabled{opacity:.8}
.vs span{grid-column:2;grid-row:1;justify-self:center;align-self:center;position:relative;z-index:2;margin:0;line-height:1;font-size:36px;font-weight:900;color:#fff;-webkit-text-stroke:3px #2a1620;paint-order:stroke fill;text-shadow:0 0 18px #ff3b6b,0 0 30px #3b5bdb,0 5px 0 #2a1620;transform:rotate(-8deg);animation:pu 1.2s infinite alternate}
@keyframes pu{to{transform:rotate(-8deg) scale(1.12)}}
.tn{display:flex;align-items:center;gap:10px;margin-bottom:6px}.tn img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.tag{font-weight:900;font-size:12px;letter-spacing:1.6px;color:var(--mu);text-align:center}
.q{font-size:22px;font-weight:900;line-height:1.3;text-align:center;margin:6px 0 10px}.qs{font-size:15px;font-weight:700;text-align:center;color:var(--mu);margin:2px 0 10px}
.tm{font-size:54px;font-weight:900;text-align:center;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}.tm.lo{color:var(--no)}
.pb{height:10px;background:#f8e6ec;border-radius:99px;overflow:hidden;margin:10px 0 14px}.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#e64980,#9c36b5);transition:width .2s linear}
.bx{padding:13px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.1);margin-top:8px;font-weight:700;text-align:center;color:#fff}.bx.ok{background:var(--ok)}.bx.no{background:var(--no)}
.sc{display:flex;justify-content:space-between;align-items:center;padding:13px 6px;border-top:1px dashed var(--bd);font-size:19px;font-weight:900}.sc:first-of-type{border-top:0}
.er{color:var(--no);font-size:14px;margin-top:6px}.win{width:100%;border-radius:24px;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
select{width:100%;padding:14px;border-radius:16px;border:2px solid var(--bd);background:#fff;color:var(--tx);font:700 17px "Nunito",sans-serif}
.halo{position:relative;isolation:isolate;width:fit-content;max-width:100%;margin:0 auto}
.halo::before{content:"";position:absolute;inset:-22px -34px;z-index:-1;border-radius:60px;background:#fdf6ec;filter:blur(7px)}
.vs{isolation:isolate}
.vh{position:absolute;left:50%;top:-40px;bottom:-40px;width:120px;margin-left:-60px;z-index:-1;border-radius:60px;background:#fdf6ec;filter:blur(7px);pointer-events:none}

function usedQ(){return G&&G.used?Object.keys(G.used).map(function(k){return G.used[k]}):[]}
function availQ(){var u={};usedQ().forEach(function(i){u[i]=1});return QS.map(function(q,i){return i}).filter(function(i){return !u[i]})}
function lvOf(i){return i<LB[0]?0:(i<LB[1]?1:2)}
function startGame(){
 var av=availQ();if(!av.length)return;
 var sh=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
 var S=[[],[],[]];av.forEach(function(i){S[lvOf(i)].push(i)});S=S.map(sh);
 /* soru sayisini kolay/orta/zor arasinda olabildigince esit bol */
 var n=Math.min(CNT,av.length),cn=[0,0,0];
 for(var g=0;g<n;g++){var b=-1;[0,1,2].forEach(function(l){if(cn[l]<S[l].length&&(b<0||cn[l]<cn[b]))b=l});cn[b]++}
 /* zorluk sirasini karistir: ayni zorluk ust uste en fazla 3 kez */
 var best=null,bv=1e9;
 for(var t=0;t<300&&bv>0;t++){
  var rem=cn.slice(),seq=[],last=-1,run=0,v=0;
  for(var q=0;q<n;q++){
   var ok=[0,1,2].filter(function(l){return rem[l]>0&&!(l===last&&run>=3)});
   if(!ok.length){ok=[0,1,2].filter(function(l){return rem[l]>0});v++}
   var tot=ok.reduce(function(x,l){return x+rem[l]},0),r=Math.random()*tot,l=ok[0];
   for(var z=0;z<ok.length;z++){r-=rem[ok[z]];if(r<0){l=ok[z];break}}
   rem[l]--;seq.push(l);run=l===last?run+1:1;last=l;
  }
  if(v<bv){bv=v;best=seq}
 }
 var pos=[0,0,0],qs=best.map(function(l){return S[l][pos[l]++]});
 var ex=sh(S[2].slice(cn[2])).concat(sh(S[1].slice(cn[1])),sh(S[0].slice(cn[0]))).slice(0,3);
 ref(B()+"/m").update({phase:"play",r:0,dur:durOf(qs[0]),endsAt:now()+durOf(qs[0])*1000,qs:qs,ex:ex.length?ex:null});
}
async function resetGame(used){

async function restartGame(){

}
function rank(s){
 var mx=Math.max(s.b,s.g),l=["b","g"].sort(function(x,y){return s[y]-s[x]});
 return l.map(function(t){return '<div class="sc"><span>'+(s[t]===mx?'👑':'🥀')+' '+esc(T[t].n)+'</span><span>'+s[t]+'</span></div>'}).join('');
}
function box(r,t){
 var x=res(r,t);
 return T[t].m.map(function(id,i){var p=x.p[i],n=R[id].n,tx=p===null?n+" cevap vermedi":(p===id?n+" kendisini seçti":n+" "+R[p].a+" seçti");return '<div class="bx '+(x.ok?'ok':'no')+'">'+esc(tx)+'</div>'}).join('');
}
function opts(t,dis,mine){
 var m=myRole(),a=A.filter(function(x){return x.r===G.r&&x.role===m})[0];
 return T[t].m.map(function(id){return '<button class="op'+(!dis&&a&&a.pick===id?' on':'')+'"'+(dis?' disabled':'')+' onclick="pick(\''+id+'\')">'+esc(R[id].n)+'</button>'}).join('');
}
function lobby(){
 var h='<div class="card" style="text-align:center"><div class="tag">OYUN KODU</div><div style="font-size:44px;font-weight:900;letter-spacing:8px;color:var(--bo)">'+esc(code)+'</div><p>Arkadaşların bu kodla katılsın, sonra herkes rolünü seçsin.</p></div>';
 ["b","g"].forEach(function(t){
  h+='<div class="card"><div class="tn"><img src="'+IMG[t]+'" alt=""><h2 style="margin:0">'+esc(T[t].n)+' Takımı</h2></div>'+T[t].m.map(function(id){
   var o=RL[id],mine=o===uid;return '<button class="'+t+(mine?' me':'')+'"'+(o&&!mine?' disabled':'')+' onclick="claim(\''+id+'\')">'+esc(R[id].n)+(mine?' (sen)':(o?' (dolu)':' ol'))+'</button>'}).join('')+'</div>';
 });
 var o=RL.y,mine=o===uid;
 h+='<div class="card"><h2>İzleyici</h2><p>Her şeyi canlı görür ama işaretleyemez.</p><button class="y'+(mine?' me':'')+'"'+(o&&!mine?' disabled':'')+' onclick="claim(\'y\')">'+esc(R.y.n)+(mine?' (sen)':(o?' (dolu)':' ol'))+'</button></div>';
 var full=RL.s&&RL.m&&RL.v&&RL.a;
 if(host()){
  var av=availQ().length,uc=QS.length-av,ops=[20,30,40,60,QS.length-3];if(av&&av<20)ops=[av].concat(ops);
  if(CNT>av||ops.indexOf(CNT)<0)CNT=ops.filter(function(n){return n<=av}).pop()||av;
  h+='<div class="card"><h2>Soru sayısı</h2>'+(av?'<select onchange="CNT=+this.value">'+ops.map(function(n){return '<option value="'+n+'"'+(CNT===n?' selected':'')+(n>av?' disabled':'')+'>'+n+' soru'+(n===QS.length-3?' (hepsi)':'')+(n>av?' (yeterli soru yok)':'')+'</option>'}).join('')+'</select>':'')+'<p>Kolay, orta ve zor sorular karışık sırayla gelir.</p>'+(uc?'<p>Önceki oyunlarda gelen '+uc+' soru bu oyunda gelmeyecek. Kalan soru: '+av+'.</p><button class="alt" onclick="clearHistory()">Soru geçmişini sıfırla</button>':'')+'</div>';
  if(!av)h+='<p style="text-align:center">Tüm sorular daha önce geldi. Yeni oyun için soru geçmişini sıfırla.</p>';
  else h+='<button onclick="startGame()"'+(full?'':' disabled')+'>Oyunu Başlat</button>'+(full?'':'<p style="text-align:center">Başlamak için dört takım rolü de seçilmeli.</p>');
 }else h+='<p style="text-align:center">Oyunu kuran kişinin başlatması bekleniyor...</p>';
 return h;
}
function play(){
 var N=G.qs.length,ex=G.r>=N,lab=ex?'EŞİTLİK BOZMA SORUSU '+(G.r-N+1)+' / '+(G.ex||[]).length:'SORU '+(G.r+1)+' / '+N,m=myRole(),mt=m&&R[m].t!=="y"?R[m].t:null,sp=!mt,ov=over(),h="";
 if(!ov){
  var left=Math.max(0,Math.ceil((G.endsAt-now())/1000));
  h='<div class="card"><div class="tag">'+lab+'</div><div class="tm'+(left<=5?' lo':'')+'" id="tm">'+left+'</div><div class="pb"><i id="bar" style="width:'+Math.min(100,(G.endsAt-now())/((G.dur||15)*10))+'%"></i></div><div class="q">'+esc(qOf(G.r))+'</div>';
  if(mt)h+=opts(mt,false);
  else h+=["b","g"].map(function(t){return '<div class="tag" style="margin-top:10px">'+esc(T[t].n.toUpperCase())+' ŞIKLARI</div>'+opts(t,true)}).join('');
  h+='</div>';
 }else{
  h='<div class="card"><div class="tag">'+lab+' · SÜRE DOLDU</div><div class="qs">'+esc(qOf(G.r))+'</div>'+["b","g"].map(function(t){return '<div class="tn" style="margin-top:12px"><img src="'+IMG[t]+'" alt=""><b>'+esc(T[t].n)+'</b></div>'+box(G.r,t)}).join('')+'</div><div class="card"><h2>Puan durumu</h2>'+rank(curScore())+'</div>';
  var ni=nextInfo();h+=ni.go===null?'<p style="text-align:center">Sonuç geliyor...</p>':(host()?'<button onclick="nextQ()">'+ni.lb+'</button>':'');
 }
 return h+hostBtns();
}
function end(){
 var s=scores(G.r),t=G.win||(s.b>s.g?"b":(s.g>s.b?"g":null)),h;
 if(t)h='<h1>Tebrikler!<br>Takım '+esc(T[t].n)+' kazandı!</h1><img class="win" src="'+IMG[t]+'" alt="">';
 else h='<h1>Berabere!</h1><div class="vs"><img class="l" src="'+IMG.b+'" alt=""><img class="r" src="'+IMG.g+'" alt=""></div>';
 return h+'<div class="card" style="margin-top:14px"><h2>Final skoru</h2>'+rank(s)+'</div>'+(host()?'<button onclick="playAgain()">Tekrar Oyna</button><button class="alt" onclick="restartGame()">Baştan Başla</button>':'<p style="text-align:center">Yeni oyunu oyunu kuran kişi açacak.</p>');
}
function render(){
 var h="",E=err?'<div class="er">'+esc(err)+'</div>':'';
 if(!joined){
  if(document.activeElement&&document.activeElement.id==="cd")return;
  h=VS(' home')+'<div class="halo"><h1 class="logo">Eşleşir miyiz?</h1></div><button onclick="enter(true)">Oyun Kur</button><div class="card" style="margin-top:14px"><input id="cd" placeholder="OYUN KODU" maxlength="6"><button class="alt" onclick="enter(false)">Oyuna Katıl</button>'+E+'</div>';
 }else if(!G)h='<div class="card"><p>Oyun yükleniyor...</p>'+E+'</div>';
 else if(G.phase==="lobby"){h=lobby()+E;cfOn=false;early=""}
 else if(G.phase==="tie")h=tieScr();
  else if(G.phase==="judge")h=judgeScr();
  else if(G.phase==="end"){h=end();if(!cfOn){cfOn=true;confetti()}}
 else h=play();
 app.innerHTML=h;
}
setInterval(function(){
 if(!joined||!G||G.phase!=="play")return;
 if(!over()){var all=["s","m","v","a"].every(function(id){return A.some(function(x){return x.r===G.r&&x.role===id})}),ek=code+G.r;if(all&&early!==ek&&G.endsAt-now()>5000){early=ek;ref(B()+"/m/endsAt").transaction(function(v){return v-now()>5000?now()+5000:undefined})}}
 else autoNext();
 var k=G.r+":"+over();
 if(k!==lastKey){lastKey=k;render();return}
 var t=document.getElementById("tm");if(t){var l=Math.max(0,Math.ceil((G.endsAt-now())/1000));t.textContent=l;t.className="tm"+(l<=5?" lo":"");var b=document.getElementById("bar");if(b)b.style.width=Math.min(100,Math.max(0,(G.endsAt-now())/((G.dur||15)*10)))+"%"}
},200);
function confetti(){
 var c=document.getElementById("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 var cols=["#d6336c","#3b5bdb","#ffd43b","#1fa971","#7b5cf0","#ff922b"],P=[];
 for(var i=0;i<170;i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height,w:6+Math.random()*7,h:9+Math.random()*9,v:2+Math.random()*4,s:Math.random()*2-1,a:Math.random()*6,c:cols[i%6]});
 var st=Date.now();
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.y+=p.v;p.x+=p.s*2;p.a+=.1;if(p.y>c.height&&Date.now()-st<9000){p.y=-10;p.x=Math.random()*c.width}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(Date.now()-st<12000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
try{var sc=localStorage.getItem("gc");if(db&&sc){ref("games/"+sc+"/m").once("value").then(function(s){if(s.exists())sub(sc);else render()})}}catch(e){}
render();
</script>
</body>
